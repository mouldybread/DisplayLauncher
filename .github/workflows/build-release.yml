name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags
  release:
    types: [created]
  workflow_dispatch: # Allow manual triggering

env:
  main_project_module: app

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          
          echo "VERSION_NAME=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build Release APK
        run: >-
          ./gradlew assembleRelease 
          -PCI_VERSION_CODE=${{ steps.version.outputs.VERSION_CODE }} 
          -PCI_VERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Named APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/DisplayLauncher-v${{ steps.version.outputs.VERSION_NAME }}.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayLauncher-v${{ steps.version.outputs.VERSION_NAME }}
          path: release_apk/DisplayLauncher-v${{ steps.version.outputs.VERSION_NAME }}.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release_apk/DisplayLauncher-v${{ steps.version.outputs.VERSION_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}